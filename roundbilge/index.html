<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An interactive 3D viewer for round bilge construction layers." />
    <title>Round Bilge Construction</title>
    <script type="module" crossorigin src="/roundbilge/assets/index-CvEJ5nES.js"></script>
    <link rel="stylesheet" crossorigin href="/roundbilge/assets/index-6L8aFNGd.css">
  </head>
  <body>
    <div id="app">
      <canvas id="scene" aria-label="Interactive 3D model viewer"></canvas>

      <header class="topbar">
        <div>
          <p class="eyebrow">Local model viewer</p>
          <h1>Round Bilge Construction</h1>
        </div>
        <div class="status" id="status">Loading model...</div>
      </header>

      <aside class="panel" aria-label="Viewer controls">
        <div class="panel-section">
          <span class="label">Scene</span>
          <div class="button-row">
            <button type="button" id="resetView" title="Reset camera view">Reset</button>
          </div>
        </div>

        <div class="panel-section visibility-actions">
          <span class="label">Visibility</span>
          <div class="button-row">
            <button type="button" id="showAll" title="Show all groups">All</button>
            <button type="button" id="hideAll" title="Hide all groups">None</button>
          </div>
        </div>

        <div class="layer-panel" aria-label="Model visibility groups">
          <span class="label">Layers</span>
          <div class="layer-list" id="layerList"></div>
        </div>
      </aside>

      <div class="hint">Drag to orbit. Scroll to zoom. Right drag to pan.</div>
    </div>
  </body>
</html>
