<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An interactive 3D viewer for round bilge construction layers." />
    <title>Round Bilge Construction</title>
    <script type="module" crossorigin src="/roundbilge/assets/index-Cs1D1G57.js"></script>
    <link rel="stylesheet" crossorigin href="/roundbilge/assets/index-G35FcXjs.css">
  </head>
  <body>
    <div id="app">
      <canvas id="scene" aria-label="Interactive 3D model viewer"></canvas>
      <div class="sr-only" id="status" aria-live="polite">Loading model...</div>

      <header class="topbar">
        <div>
          <p class="eyebrow">Local model viewer</p>
          <h1>Round Bilge Construction</h1>
        </div>
      </header>

      <aside class="panel" aria-label="Viewer controls">
        <button
          class="panel-toggle"
          type="button"
          id="panelToggle"
          aria-expanded="true"
          aria-controls="panelContent"
        >
          Hide layers
        </button>

        <div class="panel-content" id="panelContent">
          <div class="layer-panel" aria-label="Model visibility groups">
            <div class="layer-heading">
              <span class="label" id="layerTitle">Layers</span>
              <div class="button-row compact-actions">
                <button type="button" id="showAll" title="Show all groups">All</button>
                <button type="button" id="hideAll" title="Hide all groups">None</button>
              </div>
            </div>
            <div class="layer-list" id="layerList"></div>
          </div>
        </div>
      </aside>

      <div class="view-overlay">
        <div class="hint">Drag to orbit. Scroll to zoom. Right drag to pan.</div>
        <button type="button" id="resetView" class="reset-view" title="Reset camera view">Reset view</button>
      </div>
    </div>
  </body>
</html>
